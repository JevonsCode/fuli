<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FULI Setup pictures</title>
<link rel="stylesheet" href="art.css">
</head>
<!--
  FULI-Setup's page pictures on a transparent background, drawn on a 120 x 120
  view and rendered at each DPI: #icon the app icon (the first page), #done the
  app icon with a check (the last page), #mark the mark (the progress page),
  #folder a folder holding the app (the install location page), #small the
  app icon edge to edge (the wizard's small image).
-->
<body class="transparent">
<svg id="art" viewBox="0 0 120 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g id="icon">
    <image href="../../brand/png/app-icon/fuli-app-icon-light-1024.png" x="10" y="8" width="100" height="100" filter="url(#lift)"/>
  </g>
  <g id="check">
    <circle cx="96" cy="92" r="19" fill="#087b63" stroke="#ffffff" stroke-width="4"/>
    <path d="M 87.5 92.5 L 93.5 98.5 L 105 86.5" fill="none" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="mark">
    <image href="../../brand/svg/mark/fuli-mark-color.svg" x="8" y="8" width="104" height="104"/>
  </g>
  <g id="folder">
    <path d="M 12 30 Q 12 22 20 22 L 46 22 Q 51 22 54 27 L 58 33 L 100 33 Q 108 33 108 41 L 108 92 Q 108 100 100 100 L 20 100 Q 12 100 12 92 Z" fill="#8bc1a8"/>
    <rect x="8" y="42" width="104" height="62" rx="9" fill="#cfe6da" filter="url(#lift)"/>
    <image href="../../brand/png/app-icon/fuli-app-icon-light-1024.png" x="44" y="51" width="32" height="32"/>
    <rect x="44" y="90" width="32" height="4" rx="2" fill="#8bc1a8"/>
  </g>
  <g id="small">
    <image href="../../brand/png/app-icon/fuli-app-icon-light-1024.png" x="0" y="0" width="120" height="120"/>
  </g>
</svg>
<script>
  const shown = { '#icon': ['icon'], '#done': ['icon', 'check'], '#mark': ['mark'], '#folder': ['folder'], '#small': ['small'] }[location.hash] || ['icon'];
  for (const id of ['icon', 'check', 'mark', 'folder', 'small']) {
    if (!shown.includes(id)) document.getElementById(id).remove();
  }
</script>
</body>
</html>
