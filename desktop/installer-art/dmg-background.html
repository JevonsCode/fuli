<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FULI disk image background</title>
<link rel="stylesheet" href="art.css">
<style>
  .label { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .latin { font-size: 11px; font-weight: 500; fill: var(--muted); }
  .digit { font-size: 11px; font-weight: 700; fill: var(--white); }
</style>
</head>
<!--
  The .dmg background (660 x 460 points under Finder's title bar; its bottom
  28 points stay empty for Finder's status bar). scripts/package-macos-dmg.js
  places FULI.app at 170,150 and Applications at 490,150, icons 112 points.
  Top: drag FULI onto Applications. Bottom: an unsigned build's first open, as
  three pictures: blocked once, System Settings > Privacy & Security, Open Anyway.
  #steps renders only the bottom strip (docs/images/install/macos-first-open.png).
-->
<body class="paper">
<svg id="art" viewBox="0 0 660 460" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trail" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8bc1a8"/>
      <stop offset="1" stop-color="#087b63"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d1d1f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Drag: three growing dots, then the arrow onto Applications. -->
  <g>
    <circle cx="252" cy="152" r="3" fill="#8bc1a8"/>
    <circle cx="268" cy="149" r="4" fill="#5fa58b"/>
    <circle cx="287" cy="145" r="5" fill="#2f8d72"/>
    <path d="M 305 142 Q 352 122 398 140" fill="none" stroke="url(#trail)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 390 124 L 414 146 L 384 154" fill="none" stroke="#087b63" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- The first-open strip. -->
  <g id="steps">
    <rect x="30" y="284" width="600" height="116" rx="18" fill="#ffffff" stroke="#d6dad7"/>

    <!-- 1: FULI is held back once. -->
    <g transform="translate(130 342)">
      <image href="../../brand/png/app-icon/fuli-app-icon-light-1024.png" x="-30" y="-30" width="60" height="60" filter="url(#lift)"/>
      <circle cx="24" cy="22" r="13" fill="#e8a33d" stroke="#ffffff" stroke-width="3"/>
      <rect x="22.4" y="14" width="3.2" height="10" rx="1.6" fill="#ffffff"/>
      <circle cx="24" cy="28.6" r="1.9" fill="#ffffff"/>
    </g>

    <!-- 2: System Settings > Privacy & Security. -->
    <g transform="translate(330 342)">
      <g transform="translate(-50 0)" filter="url(#lift)">
        <rect x="-24" y="-24" width="48" height="48" rx="11" fill="#8e8e93"/>
        <g fill="#e5e5ea">
          <circle r="14"/>
          <g id="teeth">
            <rect x="-3.2" y="-19" width="6.4" height="8" rx="1.6"/>
          </g>
          <use href="#teeth" transform="rotate(45)"/>
          <use href="#teeth" transform="rotate(90)"/>
          <use href="#teeth" transform="rotate(135)"/>
          <use href="#teeth" transform="rotate(180)"/>
          <use href="#teeth" transform="rotate(225)"/>
          <use href="#teeth" transform="rotate(270)"/>
          <use href="#teeth" transform="rotate(315)"/>
        </g>
        <circle r="6" fill="#8e8e93"/>
      </g>
      <path d="M -10 -7 L -3 0 L -10 7" fill="none" stroke="#6e6e73" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(36 0)" filter="url(#lift)">
        <rect x="-24" y="-24" width="48" height="48" rx="11" fill="#2f7cf6"/>
        <!-- A raised hand. -->
        <g fill="#ffffff">
          <rect x="-9.5" y="-15" width="4.4" height="17" rx="2.2"/>
          <rect x="-4.4" y="-17.5" width="4.4" height="19" rx="2.2"/>
          <rect x="0.7" y="-16.5" width="4.4" height="18" rx="2.2"/>
          <rect x="5.8" y="-13" width="4.4" height="15" rx="2.2"/>
          <rect x="-9.5" y="-4" width="19.7" height="17" rx="7"/>
          <rect x="-9.2" y="-3" width="4.4" height="13" rx="2.2" transform="rotate(-35 -7 10)"/>
        </g>
      </g>
    </g>

    <!-- 3: Open Anyway. -->
    <g transform="translate(530 342)">
      <rect x="-82" y="-19" width="164" height="38" rx="10" fill="none" stroke="#087b63" stroke-width="3.5" opacity="0.35"/>
      <rect x="-76" y="-13" width="152" height="26" rx="7" fill="#ffffff" stroke="#c7c7cc" filter="url(#lift)"/>
      <text x="0" y="4.5" text-anchor="middle"><tspan class="label">仍要打开</tspan><tspan class="latin" dx="6">Open Anyway</tspan></text>
      <!-- Pointer. -->
      <path d="M 52 6 L 52 30 L 58 24.5 L 62.5 34 L 66.5 32.2 L 62 22.8 L 70 22.4 Z" fill="#1d1d1f" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
    </g>

    <!-- Step numbers and the way from one to the next. -->
    <g>
      <circle cx="58" cy="306" r="10" fill="#1d1d1f"/><text class="digit" x="58" y="310" text-anchor="middle">1</text>
      <circle cx="258" cy="306" r="10" fill="#1d1d1f"/><text class="digit" x="258" y="310" text-anchor="middle">2</text>
      <circle cx="458" cy="306" r="10" fill="#1d1d1f"/><text class="digit" x="458" y="310" text-anchor="middle">3</text>
    </g>
    <g fill="none" stroke="#d6dad7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 222 334 L 230 342 L 222 350"/>
      <path d="M 422 334 L 430 342 L 422 350"/>
    </g>
  </g>
</svg>
<script>
  if (location.hash === '#steps') document.getElementById('art').setAttribute('viewBox', '24 278 612 128');
</script>
</body>
</html>
