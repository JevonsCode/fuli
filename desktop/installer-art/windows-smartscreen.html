<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Windows SmartScreen steps</title>
<link rel="stylesheet" href="art.css">
<style>
  .label { font-size: 12.5px; font-weight: 600; }
  .latin { font-size: 10.5px; font-weight: 500; }
  .digit { font-size: 11px; font-weight: 700; fill: #ffffff; }
</style>
</head>
<!--
  docs/images/install/windows-smartscreen.png: an unsigned FULI-Setup is held
  back once by SmartScreen. Two pictures, words only on the two controls:
  1 the "More info" link, 2 the "Run anyway" button.
-->
<body class="paper">
<svg viewBox="0 0 612 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1d1d1f" flood-opacity="0.16"/>
    </filter>
    <g id="panel">
      <rect x="0" y="0" width="236" height="150" rx="6" fill="#1f5fa8" filter="url(#lift)"/>
      <!-- A shield, then lines standing for the text that is not the point here. -->
      <path d="M 22 18 L 34 13 L 46 18 L 46 28 Q 46 38 34 43 Q 22 38 22 28 Z" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>
      <rect x="58" y="20" width="120" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
      <rect x="58" y="34" width="92" height="6" rx="3" fill="#ffffff" opacity="0.45"/>
      <rect x="22" y="58" width="190" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
      <rect x="22" y="70" width="160" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
    </g>
  </defs>

  <!-- 1: More info. -->
  <g transform="translate(36 28)">
    <use href="#panel"/>
    <rect x="16" y="86" width="132" height="24" rx="6" fill="none" stroke="#8bc1a8" stroke-width="3"/>
    <text x="22" y="102.5" fill="#ffffff"><tspan class="label" text-decoration="underline">更多信息</tspan><tspan class="latin" dx="6" text-decoration="underline">More info</tspan></text>
    <path d="M 130 102 L 130 124 L 135.5 119 L 139.6 127.6 L 143.2 126 L 139.2 117.5 L 146.4 117.1 Z" fill="#1d1d1f" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="148" y="118" width="74" height="22" rx="3" fill="#ffffff" opacity="0.18"/>
    <circle cx="0" cy="0" r="11" fill="#1d1d1f"/><text class="digit" x="0" y="4" text-anchor="middle">1</text>
  </g>

  <path d="M 296 94 L 306 104 L 296 114" fill="none" stroke="#6e6e73" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2: Run anyway. -->
  <g transform="translate(340 28)">
    <use href="#panel"/>
    <rect x="22" y="86" width="96" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
    <rect x="22" y="98" width="70" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
    <rect x="92" y="114" width="138" height="32" rx="6" fill="none" stroke="#8bc1a8" stroke-width="3"/>
    <rect x="97" y="119" width="128" height="22" rx="3" fill="#ffffff"/>
    <text x="161" y="134.5" text-anchor="middle" fill="#1d1d1f"><tspan class="label">仍要运行</tspan><tspan class="latin" dx="5" fill="#6e6e73">Run anyway</tspan></text>
    <path d="M 208 134 L 208 156 L 213.5 151 L 217.6 159.6 L 221.2 158 L 217.2 149.5 L 224.4 149.1 Z" fill="#1d1d1f" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="11" fill="#1d1d1f"/><text class="digit" x="0" y="4" text-anchor="middle">2</text>
  </g>
</svg>
</body>
</html>
