name: fuli_desktop
description: "FULI desktop client: shows whether FULI works and fixes it with buttons."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  local_notifier: ^0.1.6
  url_launcher: ^6.3.3
  ffi: ^2.2.0
  flutter_inappwebview: ^6.1.5
  screen_retriever: ^0.2.2
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
    - assets/app/
    - assets/brand/
