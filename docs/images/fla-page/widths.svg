<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="widths-title">
  <title id="widths-title">The FLA page at three window widths</title>
  <style>
    .f { fill: none }
    .s { stroke: #9a9a93; stroke-width: 1 }
    .d { stroke: #c8c8c0; stroke-width: 1; stroke-dasharray: 3 3 }
    .t { fill: #4a4a46; font: 10px "Helvetica Neue", Arial, sans-serif }
    .tm { fill: #8a8a84; font: 9px "Helvetica Neue", Arial, sans-serif }
    .tb { fill: #2a2a28; font: 600 11px "Helvetica Neue", Arial, sans-serif }
    .ink { fill: #1d1d20 }
    .pg { fill: #f2f2ef }
  </style>

  <!-- laptop 1280 -->
  <text class="tb" x="12" y="16">笔记本 1280×860</text>
  <text class="tm" x="12" y="30">页面不滚动，只有工作列滚动</text>
  <rect class="pg" x="12" y="38" width="236" height="264" rx="6"/>
  <rect class="f s" x="12" y="38" width="236" height="264" rx="6"/>
  <rect class="f s" x="40" y="52" width="180" height="46" rx="8" fill="#fff"/>
  <rect class="f s" x="48" y="60" width="20" height="20" rx="6"/>
  <text class="t" x="76" y="70">名字</text>
  <rect class="ink" x="160" y="58" width="36" height="14" rx="5"/>
  <rect class="f s" x="200" y="58" width="14" height="14" rx="5"/>
  <line class="s" x1="40" y1="84" x2="220" y2="84"/>
  <circle cx="50" cy="91" r="2.5" fill="#a8824a"/>
  <text class="tm" x="58" y="94">正在做「…」 5/8</text>
  <rect class="f d" x="40" y="106" width="180" height="184" rx="8"/>
  <text class="tm" x="48" y="122">手上的活</text>
  <rect class="f s" x="48" y="128" width="164" height="22" rx="6" fill="#fff"/>
  <rect class="f s" x="48" y="156" width="164" height="18" rx="6" fill="#fff"/>
  <text class="tm" x="48" y="194">最近做完</text>
  <line class="s" x1="48" y1="202" x2="212" y2="202" stroke="#e6e6e1"/>
  <line class="s" x1="48" y1="216" x2="212" y2="216" stroke="#e6e6e1"/>
  <text class="tm" x="48" y="240">在哪干的活</text>
  <rect class="f d" x="48" y="246" width="164" height="16" rx="6"/>
  <text class="tm" x="48" y="282">负责什么 · 学会了 · 起步包</text>
  <text class="tm" x="12" y="318">一列，居中 960px；两侧是页面留白，不放第二列</text>

  <!-- wide -->
  <text class="tb" x="266" y="16">宽屏 2560</text>
  <text class="tm" x="266" y="30">同一列，不拉宽、不开第二列</text>
  <rect class="pg" x="266" y="38" width="236" height="264" rx="6"/>
  <rect class="f s" x="266" y="38" width="236" height="264" rx="6"/>
  <rect class="f s" x="316" y="52" width="136" height="46" rx="8" fill="#fff"/>
  <rect class="f s" x="322" y="60" width="18" height="18" rx="6"/>
  <text class="t" x="346" y="70">名字</text>
  <rect class="ink" x="398" y="58" width="32" height="14" rx="5"/>
  <rect class="f s" x="434" y="58" width="12" height="14" rx="5"/>
  <line class="s" x1="316" y1="84" x2="452" y2="84"/>
  <circle cx="324" cy="91" r="2.5" fill="#a8824a"/>
  <text class="tm" x="332" y="94">正在做「…」 5/8  CC Cx</text>
  <rect class="f d" x="316" y="106" width="136" height="184" rx="8"/>
  <text class="tm" x="324" y="122">手上的活</text>
  <rect class="f s" x="324" y="128" width="120" height="22" rx="6" fill="#fff"/>
  <rect class="f s" x="324" y="156" width="120" height="18" rx="6" fill="#fff"/>
  <text class="tm" x="324" y="194">最近做完</text>
  <line class="s" x1="324" y1="202" x2="444" y2="202" stroke="#e6e6e1"/>
  <text class="tm" x="324" y="240">在哪干的活</text>
  <rect class="f d" x="324" y="246" width="120" height="16" rx="6"/>
  <text class="tm" x="324" y="282">负责什么 · 起步包</text>
  <text class="tm" x="266" y="318">现在那行拿到的宽度多，进度和客户端不再折行</text>

  <!-- narrow -->
  <text class="tb" x="520" y="16">窄窗 &lt;860</text>
  <text class="tm" x="520" y="30">整页一列，整页滚动</text>
  <rect class="pg" x="520" y="38" width="128" height="264" rx="6"/>
  <rect class="f s" x="520" y="38" width="128" height="264" rx="6"/>
  <rect class="f s" x="528" y="48" width="112" height="60" rx="8" fill="#fff"/>
  <rect class="f s" x="534" y="54" width="18" height="18" rx="6"/>
  <text class="t" x="558" y="64">名字</text>
  <text class="tm" x="534" y="82">前端工程师 · FLA 000289</text>
  <rect class="ink" x="534" y="88" width="68" height="14" rx="5"/>
  <rect class="f s" x="606" y="88" width="28" height="14" rx="5"/>
  <rect class="f s" x="528" y="114" width="112" height="28" rx="8" fill="#fff"/>
  <circle cx="536" cy="124" r="2.5" fill="#a8824a"/>
  <text class="tm" x="544" y="127">正在做「…」</text>
  <text class="tm" x="536" y="138">5/8 · CC Cx · 12 分钟前</text>
  <text class="tm" x="528" y="160">手上的活</text>
  <rect class="f s" x="528" y="166" width="112" height="22" rx="6" fill="#fff"/>
  <rect class="f s" x="528" y="192" width="112" height="18" rx="6" fill="#fff"/>
  <text class="tm" x="528" y="230">最近做完</text>
  <line class="s" x1="528" y1="238" x2="640" y2="238" stroke="#e6e6e1"/>
  <line class="s" x1="528" y1="252" x2="640" y2="252" stroke="#e6e6e1"/>
  <text class="tm" x="528" y="274">在哪干的活 · 负责什么</text>
  <text class="tm" x="520" y="318">主要动作铺满一行，</text>
  <text class="tm" x="520" y="328">现在那行折成两行，顺序不变</text>
</svg>
