[workspace]
resolver = "3"
members = [
    "crates/fuli-ipc",
    "crates/fuli-context",
    "crates/fuli-cli",
    "crates/fuli-ui-kit",
    "crates/fuli-ui",
]

[workspace.package]
version = "1.0.0-next.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
fuli-ipc = { path = "crates/fuli-ipc" }
fuli-ui-kit = { path = "crates/fuli-ui-kit" }
interprocess = "2.4.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.27.0"
gpui-kit = "0.11.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "s"
