name: fuli-alignment

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${FULI_ALIGNMENT_NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 64m
    ports:
      - "127.0.0.1:${FULI_ALIGNMENT_NEO4J_HTTP_PORT}:7474"
      - "127.0.0.1:${FULI_ALIGNMENT_NEO4J_BOLT_PORT}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}"
          "RETURN 1" >/dev/null
      interval: 3s
      timeout: 3s
      retries: 40

  provider:
    build:
      context: ../../graph-provider
    environment:
      FULI_PROVIDER_MODE: personal
      FULI_PROVIDER_ID: alignment-fixture
      FULI_PROVIDER_NAME: Fuli Alignment Fixture Provider
      FULI_BOOTSTRAP_TOKEN: ${FULI_ALIGNMENT_BOOTSTRAP_TOKEN}
      FULI_HUMAN_REVIEW_TOKEN: ${FULI_ALIGNMENT_HUMAN_REVIEW_TOKEN}
      FULI_WORKFLOW_OBSERVATION_TOKEN: ${FULI_ALIGNMENT_WORKFLOW_OBSERVATION_TOKEN}
      FULI_NEO4J_URI: bolt://neo4j:7687
      FULI_NEO4J_USER: neo4j
      FULI_NEO4J_PASSWORD: ${FULI_ALIGNMENT_NEO4J_PASSWORD}
      FULI_EMBEDDING_DIM: 384
      EMBEDDING_DIM: 384
      GRAPHITI_TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:${FULI_ALIGNMENT_PROVIDER_PORT}:8787"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
