name: fuli-graphiti

services:
  personal-neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${FULI_PERSONAL_NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: "${FULI_NEO4J_HEAP_INITIAL_SIZE:-256m}"
      NEO4J_server_memory_heap_max__size: "${FULI_NEO4J_HEAP_MAX_SIZE:-512m}"
      NEO4J_server_memory_pagecache_size: "${FULI_NEO4J_PAGECACHE_SIZE:-256m}"
    ports:
      - "127.0.0.1:${FULI_PERSONAL_NEO4J_HTTP_PORT:-8060}:7474"
      - "127.0.0.1:${FULI_PERSONAL_NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - personal_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  workspace-neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${FULI_WORKSPACE_NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: "${FULI_NEO4J_HEAP_INITIAL_SIZE:-256m}"
      NEO4J_server_memory_heap_max__size: "${FULI_NEO4J_HEAP_MAX_SIZE:-512m}"
      NEO4J_server_memory_pagecache_size: "${FULI_NEO4J_PAGECACHE_SIZE:-256m}"
    ports:
      - "127.0.0.1:${FULI_WORKSPACE_NEO4J_HTTP_PORT:-7475}:7474"
      - "127.0.0.1:${FULI_WORKSPACE_NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - workspace_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  personal-provider:
    build:
      context: ./graph-provider
    environment:
      FULI_PROVIDER_MODE: personal
      FULI_PROVIDER_ID: local-personal
      FULI_PROVIDER_NAME: Fuli Personal Provider
      FULI_BOOTSTRAP_TOKEN: ${FULI_PERSONAL_BOOTSTRAP_TOKEN}
      FULI_HUMAN_REVIEW_TOKEN: ${FULI_PERSONAL_HUMAN_REVIEW_TOKEN}
      FULI_WORKFLOW_OBSERVATION_TOKEN: ${FULI_PERSONAL_WORKFLOW_OBSERVATION_TOKEN}
      FULI_NEO4J_URI: bolt://personal-neo4j:7687
      FULI_NEO4J_USER: neo4j
      FULI_NEO4J_PASSWORD: ${FULI_PERSONAL_NEO4J_PASSWORD}
      FULI_EMBEDDING_DIM: 384
      EMBEDDING_DIM: 384
      GRAPHITI_TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:${FULI_PERSONAL_PROVIDER_PORT:-8787}:8787"
    depends_on:
      personal-neo4j:
        condition: service_healthy
    restart: unless-stopped

  workspace-provider:
    build:
      context: ./graph-provider
    environment:
      FULI_PROVIDER_MODE: workspace
      FULI_PROVIDER_ID: development-workspace
      FULI_PROVIDER_NAME: Fuli Workspace Provider
      FULI_BOOTSTRAP_TOKEN: ${FULI_WORKSPACE_BOOTSTRAP_TOKEN}
      FULI_NEO4J_URI: bolt://workspace-neo4j:7687
      FULI_NEO4J_USER: neo4j
      FULI_NEO4J_PASSWORD: ${FULI_WORKSPACE_NEO4J_PASSWORD}
      FULI_EMBEDDING_DIM: 384
      EMBEDDING_DIM: 384
      GRAPHITI_TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:${FULI_WORKSPACE_PROVIDER_PORT:-8788}:8787"
    depends_on:
      workspace-neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  personal_neo4j_data:
  workspace_neo4j_data:
