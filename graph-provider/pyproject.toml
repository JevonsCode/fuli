[project]
name = "fuli-graph-provider"
version = "0.27.3"
description = "Graphiti-backed personal and shared project provider for Fuli."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "graphiti-core==0.29.2",
  # The Neo4j driver's own Rust codec (rec#126): without it the driver decodes
  # every row in pure Python. Each release requires the driver of the same
  # version (here neo4j==6.4.1), so the two are bumped together.
  "neo4j-rust-ext==6.4.1.0",
  "openai>=1.91,<2",
  "pydantic-settings==2.10.1",
  "pynacl==1.6.2",
  "uvicorn[standard]==0.35.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fuli_graph*"]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-split==0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"
