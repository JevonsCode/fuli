[project]
name = "fuli-graph-provider"
version = "0.7.5"
description = "Graphiti-backed personal and shared project provider for Fuli."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "graphiti-core==0.29.2",
  "openai>=1.91,<2",
  "pydantic-settings==2.10.1",
  "uvicorn[standard]==0.35.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fuli_graph*"]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"
