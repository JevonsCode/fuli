<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#e3e9e6"/>
  <!-- Framed like the other built-in portraits: head and shoulders fill the tile. -->
  <g transform="translate(-92 -58) scale(1.32)">
  <g stroke="#1b2a44" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <!-- shoulders / jade top -->
    <path d="M150 470c4-62 50-100 106-100s102 38 106 100z" fill="#2f7a5c"/>
    <!-- neck -->
    <path d="M232 340h48v40c0 14-48 14-48 0z" fill="#f8dcc8"/>
    <!-- head -->
    <ellipse cx="256" cy="236" rx="104" ry="112" fill="#fbe7d8"/>
    <!-- ears -->
    <ellipse cx="152" cy="250" rx="20" ry="26" fill="#fbe7d8"/>
    <ellipse cx="360" cy="250" rx="20" ry="26" fill="#fbe7d8"/>
    <!-- short tidy hair with a swoop -->
    <path d="M150 226c-6-82 46-132 112-132 70 0 112 46 106 122-30-18-62-50-74-84-26 44-84 76-144 94z" fill="#1b2a44"/>
    <path d="M300 92c20-26 46-30 62-20" fill="none"/>
  </g>
  <!-- face -->
  <g fill="#1b2a44">
    <ellipse cx="216" cy="250" rx="11" ry="13"/>
    <ellipse cx="296" cy="250" rx="11" ry="13"/>
  </g>
  <path d="M226 292c18 18 42 18 60 0" fill="none" stroke="#1b2a44" stroke-width="12" stroke-linecap="round"/>
  <circle cx="190" cy="282" r="13" fill="#f4b9a3" opacity=".8"/>
  <circle cx="322" cy="282" r="13" fill="#f4b9a3" opacity=".8"/>
  <!-- held planet with a ring: Astro keeps the unclaimed conversations in orbit -->
  <g stroke="#1b2a44" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="346" cy="402" r="50" fill="#e0763a"/>
    <path d="M284 418c-28 14-32 30-10 33 28 5 90-12 130-38 24-16 22-30-8-28" fill="none"/>
    <circle cx="300" cy="452" r="22" fill="#fbe7d8"/>
  </g>
  <circle cx="330" cy="384" r="9" fill="#f6c19a"/>
  </g>
</svg>
