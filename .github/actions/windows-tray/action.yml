name: Build the Windows tray package
description: >-
  Builds the per-user Windows package a release attaches and the one-click
  update installs: the portable runtime, the current application, the Flutter
  desktop client (desktop/flutter) in client\ with the Fuli.exe launcher, as
  one zip and its SHA-256 in the release output folder, and from the same tray
  directory the one-file installer FULI-Setup-<version>.exe and its SHA-256
  (desktop/windows-setup/fuli-setup.iss). Expects a checkout and npm ci already
  done on a Windows runner.
inputs:
  setup:
    description: Also build FULI-Setup-<version>.exe ("false" builds only the zip)
    default: "true"
outputs:
  release:
    description: Folder holding the zip and its .sha256
    value: ${{ steps.package.outputs.release }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: 3.41.9
        cache: true
    - name: Build the desktop client
      shell: pwsh
      working-directory: desktop/flutter
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        flutter pub get
        flutter build windows --release
    - name: Prepare the pinned Neo4j and a Java 21 runtime
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $assets = Join-Path $env:RUNNER_TEMP 'fuli-assets'
        New-Item -ItemType Directory -Force $assets | Out-Null
        $pin = node --input-type=module -e "const m = await import('./src/native-runtime/runtime.js'); console.log(JSON.stringify({ url: m.NATIVE_NEO4J_URL, sha256: m.NATIVE_NEO4J_SHA256, version: m.NATIVE_NEO4J_VERSION }))" | ConvertFrom-Json
        $archive = Join-Path $env:RUNNER_TEMP 'neo4j.tar.gz'
        Invoke-WebRequest -Uri $pin.url -OutFile $archive
        if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'Neo4j archive checksum mismatch' }
        & "$env:SystemRoot\System32\tar.exe" -xzf $archive -C $assets
        Rename-Item (Join-Path $assets "neo4j-community-$($pin.version)") 'neo4j'
        & "$env:JAVA_HOME\bin\jlink.exe" --module-path "$env:JAVA_HOME\jmods" --add-modules ALL-MODULE-PATH --strip-debug --no-man-pages --no-header-files --output (Join-Path $assets 'jre21')
    - name: Build and package the Windows tray
      id: package
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $t = $env:RUNNER_TEMP
        node scripts/build-windows-portable.js --output "$t\fuli-portable" --asset-root "$t\fuli-assets" --build-python python --cache-dir "$t\fuli-cache"
        node scripts/build-windows-tray.js --asset-bundle "$t\fuli-portable" --client "$env:GITHUB_WORKSPACE\desktop\flutter\build\windows\x64\runner\Release" --output "$t\fuli-tray" --data-dir "$t\fuli-tray-data"
        node scripts/package-windows-tray-release.js --tray "$t\fuli-tray" --output "$t\fuli-release"
        "release=$t\fuli-release" >> $env:GITHUB_OUTPUT
    - name: Make sure Inno Setup 6 is available
      if: inputs.setup == 'true'
      id: inno
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
        # fuli-setup.iss needs 6.3 or later (ExecAndCaptureOutput); an older preinstalled copy is upgraded.
        if (-not (Test-Path $iscc) -or [version](Get-Item $iscc).VersionInfo.ProductVersion -lt [version]'6.3') {
          choco upgrade innosetup --no-progress -y
        }
        if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
        Write-Output "Inno Setup $((Get-Item $iscc).VersionInfo.ProductVersion)"
        "iscc=$iscc" >> $env:GITHUB_OUTPUT
    - name: Build the one-file installer
      if: inputs.setup == 'true'
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $t = $env:RUNNER_TEMP
        node scripts/build-windows-setup.js --tray "$t\fuli-tray" --output "$t\fuli-release" --iscc "${{ steps.inno.outputs.iscc }}"
