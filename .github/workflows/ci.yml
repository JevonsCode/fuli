name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx --yes npm@11.13.0 audit --audit-level=low
      - run: npm test
      - run: npm run test:package

  provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: graph-provider/pyproject.toml
      - run: python -m pip install './graph-provider[dev]'
      - run: python -m pytest -q graph-provider/tests
      - run: docker compose -f compose.graphiti.yml config --quiet

  # The Provider's real-graph tests skip without a disposable Neo4j; this job
  # runs them so a contract change cannot leave them silently stale.
  provider-neo4j:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/fixture-pass
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p fixture-pass 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      FULI_TEST_NEO4J_URI: bolt://127.0.0.1:7687
      FULI_TEST_NEO4J_EPHEMERAL: "1"
      FULI_TEST_NEO4J_PASSWORD: fixture-pass
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: graph-provider/pyproject.toml
      - run: python -m pip install './graph-provider[dev]'
      - run: python -m pytest -q graph-provider/tests -k neo4j

  # Installer, update, rollback and ACP code paths only run on Windows.
  node-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
