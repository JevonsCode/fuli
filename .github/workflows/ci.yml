name: FULI NEXT CI

on:
  push:
    branches: ["next", "next/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, Test & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Verify strict process dependency boundaries
        shell: bash
        run: |
          if cargo tree -p fuli-context | grep -q "gpui"; then
            echo "ERROR: fuli-context must NEVER depend on gpui!"
            exit 1
          fi
          if cargo tree -p fuli-cli | grep -Eq "gpui|rusqlite|tray-icon"; then
            echo "ERROR: fuli-cli must NEVER depend on gpui, rusqlite, or tray-icon!"
            exit 1
          fi
          if cargo tree -p fuli-ui | grep -Eq "rusqlite|tray-icon"; then
            echo "ERROR: fuli-ui must NEVER depend on rusqlite or tray-icon!"
            exit 1
          fi
      - name: Clippy across entire workspace (including Gallery & Recall Eval)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run full workspace unit, recall-eval & E2E tests
        run: cargo test --workspace
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Package Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File packaging/windows/build-package.ps1
      - name: Package macOS FULI.app & DMG
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/macos/build-app-and-dmg.sh
      - name: Upload Windows release artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FULI-windows-x64
          path: dist-next/*.zip
      - name: Upload macOS release artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: FULI-macos-dmg
          path: dist-next/*.dmg
