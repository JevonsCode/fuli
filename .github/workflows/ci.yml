name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # dependency-audit.yml starts CI on its fix branch: a push made with the
  # workflow token starts no workflow, a dispatch is the exception.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      # Only an advisory in what ships to users blocks a pull request: the
      # production install and the packages built into the console bundle,
      # which npm test recorded when it built the console (pretest). An
      # advisory only in a test or build tool is left to dependency-audit.yml,
      # which audits the whole tree daily and opens a fix pull request or an issue.
      - name: Audit what ships to users
        run: |
          npx --yes npm@11.13.0 audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node scripts/audit-shipped.js "$RUNNER_TEMP/npm-audit.json"
      - run: npm run test:package

  provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: graph-provider/pyproject.toml
      - run: python -m pip install './graph-provider[dev]'
      - run: python -m pytest -q graph-provider/tests
      - run: docker compose -f compose.graphiti.yml config --quiet

  # rec#11 D-34.3: on a pull request the Neo4j jobs run only when a path they
  # depend on changed; a push to main or a manual run always runs them.
  # test/ci-neo4j-paths.test.js fails when a Neo4j test starts depending on a
  # path this list leaves out.
  changes:
    runs-on: ubuntu-latest
    outputs:
      neo4j: ${{ steps.filter.outputs.neo4j }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          # An empty token makes the filter read the changes from the checkout,
          # so the workflow keeps its contents-only permissions.
          token: ""
          filters: |
            neo4j:
              - 'graph-provider/**'
              - 'src/**'
              - 'packages/roundtable/**'
              - 'test-support/**'
              - 'test/agent-dismissal-acceptance.test.js'
              - 'test/conversation-hook-neo4j-acceptance.test.js'
              - 'test/project-agent-memory-acceptance.test.js'
              - 'test/task-memory-checkpoint-atomicity.test.js'
              - 'acceptance/worker-run-host-live.js'
              - 'acceptance/public-submission-no-delivery-live.js'
              - 'package.json'
              - 'npm-shrinkwrap.json'
              - 'compose.graphiti.yml'
              - '.github/workflows/ci.yml'

  # The Provider's real-graph tests and the Node Neo4j acceptance files skip
  # without a disposable Neo4j; these jobs run them so a contract change cannot
  # leave them silently stale. The Python cases empty their graph, so they split
  # across jobs that each own a Neo4j rather than run in parallel on one graph.
  provider-neo4j-shards:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.neo4j == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/fixture-pass
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p fixture-pass 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      FULI_TEST_NEO4J_URI: bolt://127.0.0.1:7687
      FULI_TEST_NEO4J_EPHEMERAL: "1"
      FULI_TEST_NEO4J_PASSWORD: fixture-pass
      # The graph format tests empty this disposable graph between their cases.
      FULI_TEST_NEO4J_RESETTABLE: "1"
    steps:
      - uses: actions/checkout@v6
      # Some Python cases drive Node entry points against the Provider.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: graph-provider/pyproject.toml
      - run: python -m pip install './graph-provider[dev]'
      - run: python -m pytest -q graph-provider/tests -k neo4j --splits 4 --group ${{ matrix.shard }}

  provider-neo4j-node:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.neo4j == 'true'
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/fixture-pass
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p fixture-pass 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      FULI_TEST_NEO4J_URI: bolt://127.0.0.1:7687
      FULI_TEST_NEO4J_EPHEMERAL: "1"
      FULI_TEST_NEO4J_PASSWORD: fixture-pass
      # The graph format tests empty this disposable graph between their cases.
      FULI_TEST_NEO4J_RESETTABLE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: graph-provider/pyproject.toml
      - run: python -m pip install './graph-provider[dev]'
      # The Node acceptance files start the Provider over HTTP on the same graph.
      # They share its one bootstrap principal, so the script runs them serially.
      - run: npm run test:neo4j
        env:
          FULI_TEST_PYTHON: python

  # The required check keeps its name. It fails when any Neo4j job failed or was
  # cancelled, and passes when they succeeded or were skipped for an unrelated change.
  provider-neo4j:
    needs: [changes, provider-neo4j-shards, provider-neo4j-node]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Neo4j job results: $RESULTS"
          test "$FAILED" != "true"

  # rec#7 D-28.10: the Windows Hello helper builds here on every change, and its
  # digest is pinned the way a release pins it. It is never started in CI.
  # Provenance attestation waits for the owner to allow OIDC tokens for Actions (D-28.16).
  win-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - id: helper
        uses: ./.github/actions/win-helper
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node scripts/pin-win-helper.js native/win32/fuli-win-helper.exe --expect ${{ steps.helper.outputs.sha256 }}
      - uses: actions/upload-artifact@v4
        with:
          name: fuli-win-helper
          path: native/win32/fuli-win-helper.exe
          if-no-files-found: error

  # rec#7 D-28.30 (T13): the macOS owner probe against a real child process the
  # test starts itself; it must answer unknown while the child lives, never alive.
  node-macos-host-identity:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node --test test/agent-app-host-identity.test.js

  # macOS is the primary platform; it runs the same full suite as the Linux job.
  # The audit stays in the Linux job: it reads the lockfile, not the platform.
  node-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:package

  # Installer, update, rollback and ACP code paths only run on Windows.
  node-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
