name: FULI NEXT CI

on:
  push:
    branches: ["next", "next/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Verify strict process dependency boundaries
        shell: bash
        run: |
          if cargo tree -p fuli-context | grep -q "gpui"; then
            echo "ERROR: fuli-context must NEVER depend on gpui!"
            exit 1
          fi
          if cargo tree -p fuli-cli | grep -Eq "gpui|rusqlite|tray-icon"; then
            echo "ERROR: fuli-cli must NEVER depend on gpui, rusqlite, or tray-icon!"
            exit 1
          fi
      - name: Clippy across entire workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run full workspace unit & E2E tests
        run: cargo test --workspace
      - name: Build release binaries
        run: cargo build --release --workspace
