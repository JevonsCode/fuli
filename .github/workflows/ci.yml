name: FULI NEXT CI

on:
  push:
    branches: ["next", "next/**", "JVS/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check core & CLI (no GPU deps)
        run: cargo clippy -p fuli-ipc -p fuli-context -p fuli-cli --all-targets -- -D warnings
      - name: Test core & CLI
        run: cargo test -p fuli-ipc -p fuli-context -p fuli-cli
      - name: Check GPUI kit & desktop UI
        run: cargo check -p fuli-ui-kit -p fuli-ui --all-targets
      - name: Build release binaries
        run: cargo build --release --workspace
