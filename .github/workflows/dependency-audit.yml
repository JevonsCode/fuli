name: Dependency audit

# Pull requests block only on advisories in what ships to users (ci.yml,
# scripts/audit-shipped.js), so a new advisory in a test or build tool no
# longer turns every open pull request red. This audits the whole tree,
# development tools included, once a day. What `npm audit fix` can fix within
# the declared ranges becomes one pull request on the fix branch; what it
# cannot becomes one open issue. Later runs update both rather than add more,
# and close them when main is clean again.
on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    # The fix branch and the pull request are built from main only.
    if: github.repository == 'JevonsCode/fuli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the fix branch
      pull-requests: write # open, update or close the fix pull request
      issues: write # open, update or close the advisory issue
      actions: write # start CI on the fix branch
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # The npm CLI ci.yml and release.yml pin (test/dependency-audit.test.js).
      NPM_CLI: npm@11.13.0
      FIX_BRANCH: deps/audit-fix
      ISSUE_TITLE: "Dependency audit: advisories npm audit fix cannot fix"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # A failed audit (registry down, unreadable lockfile) fails the run rather
      # than filing a report. The fix is semver-compatible only (no --force) and
      # touches the lockfile only: nothing is installed and no install script
      # runs here. CI on the fix branch installs and tests it.
      - name: Audit every dependency and try npm audit fix
        id: audit
        run: |
          count() {
            jq -e '[.vulnerabilities[] | select(.severity != "info")] | length' "$1" \
              || { cat "$1" >&2; return 1; }
          }
          npx --yes "$NPM_CLI" audit --json > "$RUNNER_TEMP/before.json" || true
          found=$(count "$RUNNER_TEMP/before.json")
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" -eq 0 ]; then
            echo "remaining=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes "$NPM_CLI" audit --audit-level=low > "$RUNNER_TEMP/before.txt" || true
          npx --yes "$NPM_CLI" audit fix --package-lock-only || true
          npx --yes "$NPM_CLI" audit --json > "$RUNNER_TEMP/after.json" || true
          remaining=$(count "$RUNNER_TEMP/after.json")
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          npx --yes "$NPM_CLI" audit --audit-level=low > "$RUNNER_TEMP/after.txt" || true
          if git diff --quiet -- package.json npm-shrinkwrap.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A pull request or push made with the workflow token starts no workflow;
      # a dispatch is the exception, so CI on the fix branch is started by hand.
      # If the repository does not let Actions open pull requests ("Allow GitHub
      # Actions to create and approve pull requests" is off), the branch is still
      # pushed and the issue below says so.
      - name: Open or update the fix pull request
        id: pr
        if: steps.audit.outputs.changed == 'true'
        env:
          REMAINING: ${{ steps.audit.outputs.remaining }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$FIX_BRANCH"
          git commit --quiet --message "deps: npm audit fix" -- package.json npm-shrinkwrap.json
          # The same change already waiting keeps its commit and its CI run.
          if git fetch --quiet --depth=1 origin "$FIX_BRANCH" 2> /dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "$FIX_BRANCH already holds this change."
          else
            git push --force origin "HEAD:refs/heads/$FIX_BRANCH"
            gh workflow run ci.yml --ref "$FIX_BRANCH"
          fi
          {
            echo "The daily dependency audit found advisories that \`npm audit fix\` fixes within the declared version ranges. This changes the lockfile only."
            echo
            echo "CI was started on this branch by the audit workflow (a pull request opened with the workflow token starts no workflow by itself). Merge once it is green."
            echo
            echo "Before the fix:"
            echo '```'
            head -c 30000 "$RUNNER_TEMP/before.txt"
            echo '```'
            if [ "$REMAINING" -gt 0 ]; then
              echo
              echo "Not fixed here, tracked in the issue \"$ISSUE_TITLE\":"
              echo '```'
              head -c 30000 "$RUNNER_TEMP/after.txt"
              echo '```'
            fi
            echo
            echo "Skills: N/A, lockfile-only dependency update."
            echo
            echo "Run: $RUN_URL"
          } > "$RUNNER_TEMP/pr.md"
          pr=$(gh pr list --head "$FIX_BRANCH" --base main --state open --json url --jq '.[0].url // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/pr.md"
          elif pr=$(gh pr create --base main --head "$FIX_BRANCH" --title "deps: npm audit fix" \
              --body-file "$RUNNER_TEMP/pr.md" 2> "$RUNNER_TEMP/pr-error.txt"); then
            echo "Opened $pr"
          else
            cat "$RUNNER_TEMP/pr-error.txt"
            pr=""
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          fi
          echo "url=$pr" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the advisory issue
        env:
          FOUND: ${{ steps.audit.outputs.found }}
          REMAINING: ${{ steps.audit.outputs.remaining }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_BLOCKED: ${{ steps.pr.outputs.blocked }}
        run: |
          issue=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')
          if [ "$REMAINING" -gt 0 ] || [ "$PR_BLOCKED" = true ]; then
            {
              if [ "$PR_BLOCKED" = true ]; then
                echo "\`npm audit fix\` produced a lockfile fix on the \`$FIX_BRANCH\` branch, but the workflow could not open the pull request:"
                echo '```'
                cat "$RUNNER_TEMP/pr-error.txt"
                echo '```'
                echo "Open it from the branch, or turn on Settings > Actions > General > Workflow permissions > \"Allow GitHub Actions to create and approve pull requests\"."
                echo
              fi
              if [ "$REMAINING" -gt 0 ]; then
                echo "\`npm audit fix\` cannot fix these within the declared version ranges. Fix them by hand: a newer version range, an \`overrides\` entry, or another package."
                if [ -n "$PR_URL" ]; then echo "The ones it can fix are in $PR_URL."; fi
                echo
                echo "An advisory in what ships to users also fails CI on every pull request (scripts/audit-shipped.js); one only in a test or build tool does not."
                echo '```'
                head -c 50000 "$RUNNER_TEMP/after.txt"
                echo '```'
              fi
              echo
              echo "Updated by the daily dependency audit: $RUN_URL"
            } > "$RUNNER_TEMP/issue.md"
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file "$RUNNER_TEMP/issue.md"
            else
              gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue.md"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "The daily dependency audit has nothing left here: $RUN_URL"
          fi
          # main is clean: a fix pull request still open has nothing left to fix.
          if [ "$FOUND" -eq 0 ]; then
            pr=$(gh pr list --head "$FIX_BRANCH" --base main --state open --json url --jq '.[0].url // empty')
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch --comment "main has no advisories left; this fix is no longer needed. $RUN_URL"
            fi
          fi
