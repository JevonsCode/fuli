name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  # rec#7 D-28.10: the Windows Hello helper the package ships and pins. No
  # provenance attestation yet: that waits for the owner's approval (D-28.16).
  win-helper:
    if: github.repository == 'JevonsCode/fuli'
    runs-on: windows-latest
    # Read-only: only the publish job keeps the workflow's OIDC grant (npm); the helper build gets none.
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.helper.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
      - id: helper
        uses: ./.github/actions/win-helper
      - uses: actions/upload-artifact@v4
        with:
          name: fuli-win-helper
          path: native/win32/fuli-win-helper.exe
          if-no-files-found: error

  publish:
    if: github.repository == 'JevonsCode/fuli'
    needs: win-helper
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: fuli-win-helper
          path: native/win32
      - name: Pin the Windows helper digest
        run: node scripts/pin-win-helper.js native/win32/fuli-win-helper.exe --expect ${{ needs.win-helper.outputs.sha256 }}
      # rec#17 D-11: fails until data format migration part 2 opens the gate.
      - name: Release gate
        run: node scripts/release-gate.js
      - run: npx --yes npm@11.13.0 audit --audit-level=low
      - run: npm test
      - run: npm run test:package
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: graph-provider/pyproject.toml
      - run: python -m pip install "./graph-provider[dev]"
      - run: python -m pytest -q graph-provider/tests
      - run: docker compose -f compose.graphiti.yml config --quiet
      - name: Verify release tag matches package version
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME!==('v'+p.version))throw new Error('Release tag must be v'+p.version)"
      - name: Resolve npm dist-tag
        id: npm-dist-tag
        run: >-
          node -e "const p=require('./package.json');const prerelease=p.version.split('-')[1];const tag=prerelease?prerelease.split('.')[0]:'latest';if(!/^[a-z][a-z0-9-]*$/i.test(tag))throw new Error('Invalid npm dist-tag');require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT,'tag='+tag+'\n')"
      - run: npx --yes npm@11.13.0 publish --access public --tag "${{ steps.npm-dist-tag.outputs.tag }}"
