name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'JevonsCode/fuli'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npx --yes npm@11.18.0 audit --audit-level=low
      - run: npm test
      - run: npm run test:package
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: graph-provider/pyproject.toml
      - run: python -m pip install "./graph-provider[dev]"
      - run: python -m pytest -q graph-provider/tests
      - run: docker compose -f compose.graphiti.yml config --quiet
      - name: Verify release tag matches package version
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME!==('v'+p.version))throw new Error('Release tag must be v'+p.version)"
      - run: npx --yes npm@11.18.0 publish --access public
