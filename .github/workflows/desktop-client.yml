name: Desktop client

# The Flutter desktop client (desktop/flutter), the Windows tray package
# that ships it (.github/actions/windows-tray, the same build a release
# attaches) and the macOS .dmg (.github/actions/macos-app). Builds are
# workflow artifacts for testing, not release assets; they are unsigned
# (the .dmg is signed only when the Developer ID secrets exist).
on:
  pull_request:
    paths:
      - desktop/**
      - scripts/build-windows-*.js
      - scripts/package-windows-tray-release.js
      - scripts/*macos*.js
      - scripts/bundle-build.js
      - src/desktop/**
      - src/native-runtime/macos-assets.js
      - src/native-runtime/bundle-manifest.js
      - .github/actions/windows-tray/**
      - .github/actions/macos-app/**
      - .github/workflows/desktop-client.yml
  push:
    branches:
      - main
    paths:
      - desktop/**
      - scripts/build-windows-*.js
      - scripts/package-windows-tray-release.js
      - scripts/*macos*.js
      - scripts/bundle-build.js
      - src/desktop/**
      - src/native-runtime/macos-assets.js
      - src/native-runtime/bundle-manifest.js
      - .github/actions/windows-tray/**
      - .github/actions/macos-app/**
      - .github/workflows/desktop-client.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop/flutter

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: fuli-desktop-windows
          path: desktop/flutter/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      # Zipped with ditto: an artifact upload would drop the framework symlinks inside FULI.app.
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/FULI.app build/FULI-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fuli-desktop-macos
          path: desktop/flutter/build/FULI-macos.zip
          if-no-files-found: error
          retention-days: 14

  # The zip a release attaches, built from this commit: the desktop client
  # must be its only tray app (client/FULI.exe, started by the root Fuli.exe).
  windows-tray:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - id: tray
        uses: ./.github/actions/windows-tray
      - name: Check the packaged tray app
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $zip = Get-ChildItem "${{ steps.tray.outputs.release }}" -Filter *.zip | Select-Object -First 1
          $names = & "$env:SystemRoot\System32\tar.exe" -tf $zip.FullName | ForEach-Object { $_ -replace '^\./', '' }
          foreach ($required in 'Fuli.exe', 'FuliNode.exe', 'client/FULI.exe', 'client/flutter_windows.dll', 'client/data/app.so') {
            if ($names -notcontains $required) { throw "The tray package is missing $required" }
          }
          if ($names | Where-Object { $_ -match '(?i)FuliTray|ControllerRunner' }) { throw 'The retired C# tray is still packaged' }
          Write-Output "$($zip.Name): $($names.Count) entries; Fuli.exe launches client/FULI.exe"
      # Runs the setup the way a person would, without the wizard: a first
      # per-user install on the clean runner, then checks what it left.
      - name: Install with FULI-Setup.exe
        shell: pwsh
        run: |
          $setup = Get-ChildItem "${{ steps.tray.outputs.release }}" -Filter 'FULI-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No FULI-Setup-*.exe was built' }
          $log = Join-Path $env:RUNNER_TEMP 'fuli-setup.log'
          $run = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', "/LOG=`"$log`"" -Wait -PassThru
          Get-Content $log -Tail 40
          if ($run.ExitCode -ne 0) { throw "FULI-Setup exited with $($run.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA 'Programs\Fuli'
          $record = Get-Content (Join-Path $root 'installation.json') -Raw | ConvertFrom-Json
          if (-not (Test-Path (Join-Path $record.packageRoot 'Fuli.exe'))) { throw 'The installed version has no Fuli.exe' }
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\FULI'
          if ($entry.InstallLocation -ne $root) { throw "The Installed apps entry names $($entry.InstallLocation)" }
          Write-Output "$($setup.Name) installed $($record.applicationVersion) at $($record.packageRoot)"
      - uses: actions/upload-artifact@v4
        with:
          name: fuli-windows-tray
          path: ${{ steps.tray.outputs.release }}
          if-no-files-found: error
          retention-days: 7

  # The macOS .dmg (.github/actions/macos-app): FULI.app with Node, Java 21,
  # Neo4j and the Provider's Python inside, for Apple silicon. Unsigned unless
  # the Developer ID secrets exist. The smoke test mounts it, copies FULI.app
  # out, and starts FULI from it with a temporary HOME, ephemeral ports and no
  # Node, Java, Python or uv on PATH. Not attached to releases yet.
  macos-dmg:
    needs: test
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - id: mac
        uses: ./.github/actions/macos-app
        with:
          certificate-p12: ${{ secrets.MACOS_CERT_P12 }}
          certificate-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          app-password: ${{ secrets.APPLE_APP_PASSWORD }}
      - name: Install and start FULI from the disk image
        shell: bash
        run: |
          dmg="$(ls "${{ steps.mac.outputs.release }}"/*.dmg)"
          ls -l "${{ steps.mac.outputs.release }}"
          node scripts/macos-app-smoke.js "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: fuli-macos-dmg
          path: ${{ steps.mac.outputs.release }}
          if-no-files-found: error
          retention-days: 7
