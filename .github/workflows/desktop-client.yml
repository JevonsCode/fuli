name: Candidate desktop acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tray:
    timeout-minutes: 65
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a1420abc6c9932d9c671dc87f4b4fe0f76be9df5
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - id: tray
        uses: ./.github/actions/windows-tray
      - name: Check the packaged tray app
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $zip = Get-ChildItem "${{ steps.tray.outputs.release }}" -Filter *.zip | Select-Object -First 1
          $names = & "$env:SystemRoot\System32\tar.exe" -tf $zip.FullName | ForEach-Object { $_ -replace '^\./', '' }
          foreach ($required in 'Fuli.exe', 'FuliNode.exe', 'client/FULI.exe', 'client/flutter_windows.dll', 'client/data/app.so') {
            if ($names -notcontains $required) { throw "The tray package is missing $required" }
          }
          if ($names | Where-Object { $_ -match '(?i)FuliTray|ControllerRunner' }) { throw 'The retired C# tray is still packaged' }
          Write-Output "$($zip.Name): $($names.Count) entries; Fuli.exe launches client/FULI.exe"
      # Runs the setup the way a person would, without the wizard: a first
      # per-user install on the clean runner into a chosen folder (the
      # location page's /INSTALLROOT=), then checks what it left; a second run
      # must find that folder again and create nothing at the default one.
      - name: Install with FULI-Setup.exe
        shell: pwsh
        run: |
          $setup = Get-ChildItem "${{ steps.tray.outputs.release }}" -Filter 'FULI-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No FULI-Setup-*.exe was built' }
          $root = Join-Path $env:RUNNER_TEMP 'Chosen Place\Fuli'
          foreach ($pass in 'install', 'again') {
            $log = Join-Path $env:RUNNER_TEMP "fuli-setup-$pass.log"
            $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', "/LOG=`"$log`"")
            if ($pass -eq 'install') { $arguments += "`"/INSTALLROOT=$root`"" }
            $run = Start-Process $setup.FullName -ArgumentList $arguments -Wait -PassThru
            Get-Content $log -Tail 40
            if ($run.ExitCode -ne 0) { throw "FULI-Setup ($pass) exited with $($run.ExitCode)" }
          }
          $record = Get-Content (Join-Path $root 'installation.json') -Raw | ConvertFrom-Json
          if (-not (Test-Path (Join-Path $record.packageRoot 'Fuli.exe'))) { throw 'The installed version has no Fuli.exe' }
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\FULI'
          if ($entry.InstallLocation -ne $root) { throw "The Installed apps entry names $($entry.InstallLocation)" }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\Fuli')) { throw 'The second run created the default folder' }
          if (-not (Select-String -Path (Join-Path $env:RUNNER_TEMP 'fuli-setup-again.log') -Pattern 'already installed; nothing to change' -Quiet)) {
            throw 'The second run did not find the chosen installation'
          }
          Write-Output "$($setup.Name) installed $($record.applicationVersion) at $($record.packageRoot)"
      - name: Verify Windows installer and portable archive digests
        shell: pwsh
        env:
          CANDIDATE_RELEASE: ${{ steps.tray.outputs.release }}
        run: |
          $products = @(Get-ChildItem -LiteralPath $env:CANDIDATE_RELEASE -File | Where-Object { $_.Extension -in '.zip', '.exe' })
          if ($products.Count -ne 2) { throw 'Expected one installer and one portable archive' }
          foreach ($product in $products) {
            $sum = (Get-FileHash -Algorithm SHA256 -LiteralPath $product.FullName).Hash.ToLowerInvariant()
            $expected = ((Get-Content -LiteralPath ($product.FullName + '.sha256') -Raw).Trim() -split '\s+')[0]
            if ($sum -ne $expected) { throw 'Candidate checksum does not match its manifest' }
            Write-Output "CANDIDATE_PACKAGE sha256=$sum bytes=$($product.Length) name=$($product.Name)"
          }

  macos-dmg:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Read the candidate-only acceptance program
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Keep the test outside the product checkout
        shell: bash
        run: |
          cp scripts/macos-app-smoke.js "$RUNNER_TEMP/candidate-macos-smoke.mjs"
          cp acceptance/macos-installed-mcp-recovery.mjs "$RUNNER_TEMP/macos-installed-mcp-recovery.mjs"
      - name: Check out the frozen product
        uses: actions/checkout@v6
        with:
          ref: a1420abc6c9932d9c671dc87f4b4fe0f76be9df5
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify the source and runner
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a1420abc6c9932d9c671dc87f4b4fe0f76be9df5"
          test "$(uname -m)" = arm64
          sw_vers
      - run: npm ci
      - id: mac
        name: Build the candidate Apple silicon disk image
        uses: ./.github/actions/macos-app
      - name: Verify, install and test the disk image on macOS
        shell: bash
        env:
          CANDIDATE_RELEASE: ${{ steps.mac.outputs.release }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=("$CANDIDATE_RELEASE"/*.dmg)
          test "${#images[@]}" -eq 1
          dmg="${images[0]}"
          expected="$(awk '{print $1; exit}' "$dmg.sha256")"
          actual="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          test "$expected" = "$actual"
          echo "CANDIDATE_PACKAGE sha256=$actual bytes=$(stat -f %z "$dmg") name=$(basename "$dmg")"
          cp "$RUNNER_TEMP/candidate-macos-smoke.mjs" scripts/candidate-macos-smoke.mjs
          cp "$RUNNER_TEMP/macos-installed-mcp-recovery.mjs" acceptance/macos-installed-mcp-recovery.mjs
          node scripts/candidate-macos-smoke.mjs "$dmg"
