name: Deploy website

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build-site.js", "scripts/site-published-release.js", "test/site-*.test.js", "package.json", "npm-shrinkwrap.json", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # The stable download links follow the newest public, complete stable release
  # (scripts/site-published-release.js): rebuild once a release's installers are
  # attached, when the publish workflow ends. It runs on main, as Pages requires;
  # a release event would run on the tag. workflow_dispatch covers other changes.
  workflow_run:
    workflows: ["Publish npm package"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          # After a publish, the site is main's, never the commit the publish ran on.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test test/site-*.test.js
      # The release list the stable pages choose from; a deploy that cannot read it stops
      # and the site stays as it was, rather than linking a release that is not public.
      - name: Read published releases
        env:
          GH_TOKEN: ${{ github.token }}
        # A block scalar: the jq filter's braces and colons would otherwise end the YAML value.
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | {tag_name, draft, prerelease, assets: [.assets[] | {name, state, size}]}' \
            > "$RUNNER_TEMP/releases.jsonl"
      - run: npm run build:site
        env:
          FULI_SITE_RELEASES: ${{ runner.temp }}/releases.jsonl
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
