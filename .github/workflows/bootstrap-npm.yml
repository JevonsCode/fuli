name: Bootstrap npm package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'JevonsCode/fuli'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npx --yes npm@11.18.0 audit --audit-level=low
      - run: npm test
      - run: npm run test:package
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: graph-provider/pyproject.toml
      - run: python -m pip install pytest ./graph-provider
      - run: python -m pytest -q graph-provider/tests
      - run: docker compose -f compose.graphiti.yml config --quiet
      - name: Verify bootstrap version
        run: node -e "const p=require('./package.json');if(p.version!=='0.2.0')throw new Error('Bootstrap workflow only allows 0.2.0')"
      - name: Publish first version with short-lived token
        run: npx --yes npm@11.18.0 publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
