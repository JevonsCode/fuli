[package]
name = "fuli-context"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fuli-context"
path = "src/main.rs"

[dependencies]
fuli-adapters.workspace = true
fuli-delivery.workspace = true
fuli-domain.workspace = true
fuli-dreaming.workspace = true
fuli-ipc.workspace = true
fuli-roundtable.workspace = true
fuli-search.workspace = true
fuli-store.workspace = true
serde.workspace = true
serde_json.workspace = true
# System UI language for the first-run default (CoreFoundation / Win32, no runtime cost).
sys-locale = "0.3"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSObjCRuntime", "NSRunLoop", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSRunningApplication"] }
